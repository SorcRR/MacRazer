# SPDX-License-Identifier: GPL-2.0-or-later
# Build + unit tests on every push/PR, plus a syntax and lint pass over the packaging
# scripts. No hardware in CI, so the Swift tests cover what runs without a mouse attached:
# the protocol codec, command builders/parsers, battery/discharge models, persistence — and
# the in-place updater, which builds and mounts its own disk images, so the job is no longer
# the sub-second pure-layer run this comment used to describe.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # The packaging scripts are as much a part of shipping as the Swift is, and nothing
      # checked they even parsed — a stray quote would only surface when someone tried to cut
      # a release. shellcheck is preinstalled on the macOS runners; skip rather than fail if
      # that ever changes.
      - name: Check shell scripts
        run: |
          bash -n Scripts/*.sh Tests/Scripts/*.sh
          if command -v shellcheck >/dev/null; then
            # -S error only: these scripts predate any linting, and the point here is to
            # catch what would actually break a release, not to relitigate their style.
            shellcheck -S error Scripts/*.sh Tests/Scripts/*.sh
          else
            echo "shellcheck unavailable on this runner — syntax check only"
          fi
      # The release script decides things — which version is newer, where the changelog gets
      # cut — and `bash -n` only proves it parses. It shipped with two individually-valid
      # patterns that disagreed with each other, which is the kind of defect only a fixture
      # test catches.
      - name: Test shell scripts
        run: ./Tests/Scripts/release-test.sh
      # The release body is what the app's "What's new" page is built from, so a drafter that
      # silently drops a contributor or picks up the previous release's entries is a user-
      # visible bug, not a scripting inconvenience.
      - name: Test the release-notes drafter
        run: ./Tests/Scripts/release-notes-test.sh
      # Duplicate headings arrive by clean merge, so nothing conflicts and no reviewer sees
      # them — this is the only thing that will.
      - name: Check changelog structure
        run: ./Tests/Scripts/changelog-test.sh
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  # The Worker behind the device test's Send button. Its tests include the app's own full
  # report (worker/test/fixtures/full-report.json, written by DeviceReportSenderTests), so a
  # change to the report's format that the Worker would refuse fails here.
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Builds the Worker and checks wrangler.toml without deploying (no account needed).
      - run: npm run check
