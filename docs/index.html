<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MacRazer has moved to macrazer.com</title>
<link rel="canonical" href="https://macrazer.com/">
<script>
  // The site moved to macrazer.com. Old GitHub Pages links (sorcrr.github.io/MacRazer/...)
  // land on the same page and section there.
  var path = location.pathname.replace(/^\/MacRazer(?=\/|$)/i, "") || "/";
  location.replace("https://macrazer.com" + path + location.search + location.hash);
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://macrazer.com/"></noscript>
</head>
<body>
<p>MacRazer's website is now at <a href="https://macrazer.com/">macrazer.com</a>.</p>
</body>
</html>
